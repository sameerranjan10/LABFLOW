version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labflow-postgres
    restart: always
    environment:
      POSTGRES_USER: labflow_user
      POSTGRES_PASSWORD: labflow_password
      POSTGRES_DB: labflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labflow_user -d labflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labflow-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://labflow_user:labflow_password@postgres:5432/labflow_db
      - JWT_SECRET=labflow_production_jwt_secret_key_987654321
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
            python scripts/seed.py &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
